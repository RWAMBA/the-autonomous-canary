name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  CANARYGUARD_INTELLIGENCE_PROVIDER: MOCK

jobs:
  quality:
    name: Type-check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      app_version: ${{ steps.package_metadata.outputs.app_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify public CI intelligence isolation
        shell: bash
        run: |
          if [[ "${CANARYGUARD_INTELLIGENCE_PROVIDER}" != "MOCK" ]]; then
            echo "Public CI must use the mock intelligence provider." >&2
            exit 1
          fi

          if [[ -n "${OPENAI_API_KEY:-}" ]]; then
            echo "OPENAI_API_KEY must not be available to public CI." >&2
            exit 1
          fi

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          vuln-type: library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          format: table
          exit-code: "1"
          hide-progress: "true"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Display tool versions
        run: |
          node --version
          npm --version

      - name: Read application version
        id: package_metadata
        shell: bash
        run: |
          app_version="$(node --print "require('./package.json').version")"

          if [[ -z "${app_version}" ]]; then
            echo "package.json version is empty." >&2
            exit 1
          fi

          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  container:
    name: Build and verify container stack
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CANARYGUARD_API_KEY: ci-only-review-api-key-000000000000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check Dockerfile
        run: docker build --check .

      - name: Build container image
        run: |
          docker build \
            --build-arg "APP_VERSION=${{ needs.quality.outputs.app_version }}" \
            --build-arg "COMMIT_SHA=${{ github.sha }}" \
            --tag "autonomous-canary:${{ github.sha }}" \
            --tag autonomous-canary:compose \
            .

      - name: Scan container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: autonomous-canary:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: "false"
          format: table
          exit-code: "1"
          hide-progress: "true"

      - name: Verify container metadata
        shell: bash
        env:
          IMAGE_TAG: autonomous-canary:${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.quality.outputs.app_version }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          actual_version="$(
            docker image inspect "${IMAGE_TAG}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}'
          )"

          actual_revision="$(
            docker image inspect "${IMAGE_TAG}" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          )"

          if [[ "${actual_version}" != "${EXPECTED_VERSION}" ]]; then
            echo "Version mismatch: expected ${EXPECTED_VERSION}, received ${actual_version}." >&2
            exit 1
          fi

          if [[ "${actual_revision}" != "${EXPECTED_REVISION}" ]]; then
            echo "Revision mismatch: expected ${EXPECTED_REVISION}, received ${actual_revision}." >&2
            exit 1
          fi

          echo "Verified version ${actual_version} at revision ${actual_revision}."

      - name: Start canary stack
        run: |
          docker compose up \
            --detach \
            --no-build \
            --wait \
            --wait-timeout 60

      - name: Verify weighted routing
        run: npm run verify:routing

      - name: Verify autonomous promotion
        env:
          EXPECTED_DECISION: promote
        run: npm run rollout:canary

      - name: Verify autonomous rollback
        env:
          CANARY_FAILURE_EVERY: "3"
          EXPECTED_DECISION: rollback
        run: npm run rollout:canary

      - name: Verify autonomous continuation
        env:
          MAXIMUM_TOTAL_REQUESTS: "10"
          EXPECTED_DECISION: continue
        run: npm run rollout:canary

      - name: Display stack diagnostics
        if: ${{ always() }}
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100

      - name: Remove canary stack
        if: ${{ always() }}
        run: docker compose down --timeout 10

  deploy:
    name: Deploy to Render
    permissions: {}
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - quality
      - container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://the-autonomous-canary.onrender.com

    steps:
      - name: Trigger Render deployment
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"

      - name: Verify deployed revision
        shell: bash
        env:
          DEPLOYMENT_URL: https://the-autonomous-canary.onrender.com
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..40}; do
            actual_commit_sha="$(
              curl \
                --silent \
                --show-error \
                --fail \
                "${DEPLOYMENT_URL}/version" |
                jq --raw-output '.release.commitSha // empty'
            )" || actual_commit_sha=""

            if [[ "${actual_commit_sha}" == "${EXPECTED_COMMIT_SHA}" ]]; then
              curl \
                --silent \
                --show-error \
                --fail-with-body \
                "${DEPLOYMENT_URL}/health"

              echo
              echo "Verified deployed revision ${actual_commit_sha}."
              exit 0
            fi

            echo "Attempt ${attempt}: waiting for ${EXPECTED_COMMIT_SHA}; received ${actual_commit_sha:-unavailable}."
            sleep 15
          done

          echo "Timed out waiting for deployed revision ${EXPECTED_COMMIT_SHA}." >&2
          exit 1
