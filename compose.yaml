name: autonomous-canary

services:
  stable:
    image: autonomous-canary:compose
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-development}
        COMMIT_SHA: ${COMMIT_SHA:-local-compose}
    environment:
      RELEASE_CHANNEL: stable
      SIMULATED_FAILURE_EVERY: "0"
    expose:
      - "3000"
    restart: unless-stopped

  canary:
    image: autonomous-canary:compose
    environment:
      RELEASE_CHANNEL: canary
      SIMULATED_FAILURE_EVERY: "${CANARY_FAILURE_EVERY:-0}"
    expose:
      - "3000"
    restart: unless-stopped

  gateway:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    depends_on:
      stable:
        condition: service_healthy
      canary:
        condition: service_healthy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:8080/health
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped
